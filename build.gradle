plugins {
    id 'java'
    id 'org.springframework.boot' version '3.4.1'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.wilker'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // BANCO DE DADOS
    runtimeOnly 'org.postgresql:postgresql'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

    // WEB & VALIDAÇÃO
    implementation 'org.springframework.boot:spring-boot-starter-web' // Simplificado (WebMvc já vem aqui)
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // DOCUMENTAÇÃO (SWAGGER)
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.3' // Versão estável

    // LOMBOK & MAPSTRUCT (A ordem aqui importa!)
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    implementation 'org.mapstruct:mapstruct:1.6.3'
    annotationProcessor 'org.mapstruct:mapstruct-processor:1.6.3'

    // Conector necessário para Lombok + MapStruct trabalharem juntos
    annotationProcessor 'org.projectlombok:lombok-mapstruct-binding:0.2.0'

    // JSON - Suporte para datas modernas (LocalDate, LocalDateTime)
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'

    // TESTES
    testImplementation 'org.springframework.boot:spring-boot-starter-test' //
    testImplementation 'org.junit.platform:junit-platform-launcher'// Já inclui MockMvc e outros

    testImplementation 'com.h2database:h2'
}

tasks.named('test') {
    useJUnitPlatform()
}